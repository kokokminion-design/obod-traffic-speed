name: Obod Traffic Speed

on:
  schedule:
    - cron: "0,20,40 2-3 * * *"
    - cron: "0 4 * * *"
    - cron: "0,20,40 12-13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  collect-speed:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Collect traffic speeds
        run: python auto_speed.py
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OBOD_TEAM_KEY: ${{ secrets.OBOD_TEAM_KEY }}
          OBOD_API_URL: https://asivoy.pythonanywhere.com/api
          TZ: Asia/Tashkent
          
